// "Copy summary" copies whatever you right-clicked ON — a heatmap day, an hour bar, a model
// row, a stat card — and only falls back to the whole-range summary on background. The menu
// label names the scope so you can see what you are about to get before you click.
const dayLabel = (k) =>
  new Date(k + "T12:00:00").toLocaleDateString(T("locale"), { weekday: "short", month: "short", day: "numeric" });

function copyContext(el) {
  const at = (sel) => el && el.closest && el.closest(sel);

  const dayEl = at("[data-k]");
  if (dayEl) {
    const k = dayEl.dataset.k, d = DATA.days[k], label = dayLabel(k);
    if (!d || !d.msgs) return { label, text: T("copyDayEmpty", label) };
    const t = Object.entries(d.models).sort((p, q) => mTok(q[1]) - mTok(p[1]))[0];
    return { label, text: T("copyDay", label, fmtUsdCents(dayCost(k)), fmt(dayTokens(k)),
      d.msgs.toLocaleString(), d.sessions.length, t ? pretty(t[0]) : "—") };
  }

  const hourEl = at(".thbar");
  if (hourEl) {
    const tk = todayKey(), d = DATA.days[tk];
    const h = +hourEl.dataset.h, x = hourStats(d || { hours: [], hm: {} }, tk)[h];
    const label = T("hour", h);
    if (!x.tok && !x.msgs) return { label, text: T("copyHourEmpty", label, dayLabel(tk)) };
    return { label, text: T("copyHour", label, dayLabel(tk), fmtUsdCents(x.cost), fmt(x.tok),
      x.msgs.toLocaleString(), x.top ? pretty(x.top) : "—") };
  }

  // .tmrow is today-scoped, .mrow / .bank-card are range-scoped — same markup shape, different totals
  // Checked ahead of the model probe: .srow is also a .mrow, and the probe below keys off data-m,
  // which a session row does not have.
  const sessEl = at(".srow");
  if (sessEl) {
    const s = DATA.sessions && DATA.sessions[sessEl.dataset.s];
    if (s) {
      const top = Object.entries(sessModels(s)).sort((x, y) => mTok(y[1]) - mTok(x[1]))[0];
      const label = sessWhen(s);
      return { label, text: T("copySession", label, sessLen(s), fmtUsdCents(sessCost(s)),
        fmt(sessTokens(s)), s.req.toLocaleString(), s.days, top ? pretty(top[0]) : "—") };
    }
  }

  const todayModel = at(".tmrow");
  // [data-m] is required, not decorative: the serving-mode rows are .mrow too and carry no model,
  // so a bare .mrow match handed them to the model branch, which then copied the name "undefined"
  // and a row of zeros. They fall through to the range summary instead.
  const rangeModel = at(".mrow[data-m], .bank-card");
  const modelEl = todayModel || rangeModel;
  if (modelEl) {
    const m = modelEl.dataset.m;
    const scopeKeys = todayModel ? [todayKey()] : keysInRange();
    const v = { i: 0, o: 0, cw: 0, cr: 0, c1h: 0, msg: 0 };
    // Tokens merge across days, cost does not — the serving mix moves, so the billed cost is
    // accumulated day by day here for the same reason aggregate() keeps a per-model costs map.
    let mcost = 0;
    for (const k of scopeKeys) {
      const e2 = DATA.days[k] && DATA.days[k].models[m];
      if (e2) {
        v.i += e2.i; v.o += e2.o; v.cw += e2.cw; v.cr += e2.cr; v.c1h += e2.c1h || 0; v.msg += e2.msg || 0;
        mcost += mCost(m, e2) * billedMult(k, m);
      }
    }
    const scope = todayModel ? T("copyScopeToday") : rangeScopeLabel();
    return { label: pretty(m), text: T("copyModel", pretty(m), scope, fmtUsdCents(mcost),
      // v.cw is 5-minute writes only; the 1-hour tier is a separate field. Reporting the bare
      // v.cw here left the four components short of the total they sit next to — on real data
      // that was 16.5M tokens of 1h cache writes silently dropped out of the copied text.
      fmt(mTok(v)), fmt(v.i), fmt(v.o), fmt(v.cw + v.c1h), fmt(v.cr), v.msg.toLocaleString()) };
  }

  // The card is range-scoped and holds no per-element data, so this recomputes the same aggregate
  // the renderer used instead of scraping animated text back out of the DOM. Nothing nests inside
  // #cache and #cache nests inside nothing that is probed, so its position in this chain is not
  // load-bearing — unlike [data-k] and .thbar above it.
  if (at("#cache")) {
    const ca = aggregate(keysInRange());
    const label = T("ceTitle"), scope = T("copyLabel", range);
    const cacheTok = ca.totals.cw + ca.totals.cr;
    if (!cacheTok) return { label, text: T("copyCacheNone", scope) };
    const would = ca.costParts.i + ca.costParts.o + ca.noCache.w + ca.noCache.r;
    const saved = would - ca.cost;
    return { label, text: T(saved < 0 ? "copyCacheLoss" : "copyCache", scope,
      fmtUsdCents(Math.abs(saved)), cePct(saved, would), fmtUsdCents(would), fmtUsdCents(ca.cost),
      fmt(ca.totals.cr), cePct(ca.totals.cr, ca.totals.i + cacheTok), fmt(ca.totals.cw)) };
  }

  const cardEl = at("[data-card]");
  if (cardEl) {
    const label = cardEl.querySelector(".label").textContent;
    const value = cardEl.querySelector(".value").textContent;
    return { label, text: T("copyCard", label, value, rangeScopeLabel()) };
  }

  if (at("#today")) {
    const tk = todayKey(), d = DATA.days[tk], label = T("copyScopeToday");
    if (!d || !d.msgs) return { label, text: T("copyDayEmpty", dayLabel(tk)) };
    const t = Object.entries(d.models).sort((p, q) => mTok(q[1]) - mTok(p[1]))[0];
    return { label, text: T("copyDay", dayLabel(tk), fmtUsdCents(dayCost(tk)), fmt(dayTokens(tk)),
      d.msgs.toLocaleString(), d.sessions.length, t ? pretty(t[0]) : "—") };
  }

  const keys = keysInRange();
  const a = aggregate(keys), st = streaks(keys);
  const fav = Object.entries(a.models).sort((x, y) => mTok(y[1]) - mTok(x[1]))[0];
  return { label: null, text: T("copySummary", rangeScopeLabel(), fmtUsd(a.cost), fmt(a.tokens),
    a.msgs.toLocaleString(), a.sessions, a.activeDays, st.cur, st.max, fav ? pretty(fav[0]) : "") };
}

// --- CSV export ---------------------------------------------------------------------------
//
// One table, one grain: a row per (day, model), read from DATA.days[k].models[m] — the same leaf
// object every cost figure on this page is derived from. The serving-mode buckets sit at a finer
// grain and the message and session counts at a coarser one; folding either into this rectangle
// would turn an honest SUM() in a spreadsheet into a wrong one, so they stay in the JSON export,
// which is lossless and one row above this in the same menu.
//
// Everything below is machine-readable on purpose. fmt() abbreviates to "1.2M", fmtUsd() and
// fmtUsdCents() prepend a currency symbol and apply the display-only multiplier, and
// toLocaleString() inserts thousands separators that are literal field delimiters in this file.
// None of the four may appear in here.
// Names the basis every cost_usd figure was computed on, so a file opened a year from now still
// says what its numbers mean.
function csvPricingMode() { return priceMode === "billed" ? "as-billed" : "api-list"; }
// RFC 4180: a field is quoted only when it has to be, and an embedded quote is doubled.
const csvField = (s) => {
  const v = String(s);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
};
// Model ids come from the transcript, and a spreadsheet evaluates a cell that opens with one of
// these as a formula. Quoting does not stop that — the parser strips the quotes first — so a
// hostile id is defused with a leading apostrophe instead. No real id trips this.
const csvText = (s) => csvField(/^[=+\-@\t\r]/.test(String(s)) ? "'" + s : s);
const CSV_HEADER = ["date", "model", "input_tokens", "output_tokens", "cache_write_5m_tokens",
  "cache_write_1h_tokens", "cache_read_tokens", "total_tokens", "billed_requests",
  "assistant_messages", "input_rate_usd_per_mtok", "output_rate_usd_per_mtok",
  "rate_is_guess", "serving_multiplier", "cost_usd", "pricing_mode"];
// Every column is ASCII by construction — ISO dates, raw transcript model ids, integers — so the
// file carries no byte order mark. Excel on Windows decodes an unmarked file with the system
// codepage, so if a column ever gains non-ASCII text, prepend "﻿" here and only then. That is
// also the reason the model id is written raw rather than through pretty().
function buildCsv() {
  const mode = csvField(csvPricingMode());
  const rows = [CSV_HEADER.join(",")];
  for (const k of dayKeys) {
    const d = DATA.days[k];
    if (!d) continue;
    // Object key order is file-scan order, so sort it: the same history exported on two machines
    // should produce the same bytes and diff clean.
    for (const m of Object.keys(d.models).sort()) {
      const v = d.models[m];
      // The lookup rates() does, repeated inline so the row can also report whether the rate came
      // from the table or is the fallback guess wearing a confident face.
      const hit = PRICING.find(([re]) => re.test(m));
      const r = hit ? hit[1] : FALLBACK_RATE;
      // Deduplicated billed requests, rolled up from the serving buckets. models[m].msg counts
      // assistant records and runs about 2.5x higher on real transcripts, so both are carried
      // under their own names rather than one being passed off as the other.
      let reqs = 0;
      for (const b of Object.values(d.sp || {})) if (b[m]) reqs += b[m][5] || 0;
      // The pricing lens is a scalar on this exact (day, model), so it gets its own column rather
      // than being baked silently into cost_usd. That keeps every row auditable: the list rates
      // times the tokens times this factor reproduces cost_usd, in either mode.
      const f = billedMult(k, m);
      rows.push([
        k, csvText(m),
        v.i, v.o, v.cw, v.c1h || 0, v.cr, mTok(v),
        reqs, v.msg || 0,
        r[0], r[1], hit ? "false" : "true",
        f.toFixed(6),
        // Unconverted USD at six decimal places. CUR is a display multiplier and has no place in a
        // column whose name says usd; six places sits well below the smallest row that can bill
        // anything at all.
        (mCost(m, v) * f).toFixed(6),
        mode,
      ].join(","));
    }
  }
  // CRLF per RFC 4180, header included, and a terminator on the last row too.
  return rows.join("\r\n") + "\r\n";
}
// The basis goes in the filename because more than one of these ends up in a downloads folder, and
// the browser's "(1)" suffix does not say which one is which.
const csvFileName = () =>
  "ccstats-daily-" + String(csvPricingMode()).replace(/[^A-Za-z0-9._-]+/g, "-") + ".csv";
// Same shape as the JSON export: a blob built from a string already in memory, handed to a
// synthetic anchor. No fetch, no form, no subresource — so there is nothing here for the page's
// CSP to govern, and it behaves identically offline and from file://.
function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Every copied figure follows the active lens, so the copied text has to name it — a pasted
// "$2,999" that silently means something different from the one in the next message is worse than
// no number at all. One appended clause rather than a sixth argument on five copy functions, three
// of which already take different arities in different locales.
function withMode(c) {
  if (priceMode !== "billed" || !c || !c.text) return c;
  return { label: c.label, text: c.text + " · " + T("pmCopyNote") };
}

let ctxCopy = null;
document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  ctxCopy = withMode(copyContext(e.target));
  // applyStatic() resets this row from data-i18n on every language change, so the label is
  // re-derived from the live state each time the menu opens rather than only on toggle
  const rl = ctx.querySelector('[data-act="redact"]');
  if (rl) rl.innerHTML = icon(redacted ? "eye" : "eyeoff") +
    "<span>" + T(redacted ? "ctxUnredact" : "ctxRedact") + "</span>";
  ctx.querySelector('[data-act="copy"] span').textContent =
    ctxCopy.label ? T("ctxCopyOf", ctxCopy.label) : T("ctxCopy");
  ctx.classList.add("open");
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(e.clientX, innerWidth - w - 10) + "px";
  ctx.style.top = Math.min(e.clientY, innerHeight - h - 10) + "px";
});

// copy confirmation — one chip, bottom centre, replaces itself if you copy again
let toastTimer = null;
const toastEl = document.createElement("div");
toastEl.className = "toast";
document.body.appendChild(toastEl);
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}
document.addEventListener("click", (e) => { if (!ctx.contains(e.target)) closeCtx(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCtx(); });

ctx.addEventListener("click", (e) => {
  const el = e.target.closest(".el");
  if (!el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  switch (el.dataset.act) {
    case "copy": {
      const c = ctxCopy || withMode(copyContext(null));
      navigator.clipboard.writeText(c.text)
        .then(() => {
          confetti(cx, cy, { n: 10 });
          toast(c.label ? T("copiedOf", c.label) : T("copied"));
        })
        .catch(() => toast(T("copyFailed")));
      break;
    }
    case "export": {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ccstats-data.json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(T("exported", a.download));
      break;
    }
    case "csv": {
      const name = csvFileName();
      downloadFile(name, buildCsv(), "text/csv;charset=utf-8");
      toast(T("exported", name));
      break;
    }
    case "theme": themeInput.click(); break;
    case "lang": setLang(lang === "en" ? "ko" : "en"); break;
    case "book": rollBook(); break;
    case "redact": setRedacted(!redacted); break;
    case "hello": closeCtx(); showHello(); break;
    // Opens GitHub in a new tab with the issue form already filled in. The page itself sends
    // nothing — no fetch, no form post, no beacon; the report only exists once the reader reads
    // it over and presses submit on GitHub. That is the only shape a feedback button can take
    // here without contradicting the promise at the top of this file.
    case "feedback": {
      closeCtx();
      const url = "https://github.com/heistkit/ccusage-interface/issues/new?title=" +
        encodeURIComponent(T("fbTitle")) + "&body=" + encodeURIComponent(T("fbBody"));
      // noopener/noreferrer: the new tab gets no handle back to this document
      window.open(url, "_blank", "noopener,noreferrer");
      break;
    }
    case "party":
      document.body.classList.toggle("party");
      confetti(cx, cy, { n: 40 });
      document.title = document.body.classList.contains("party") ? T("partyTitle") : "ccstats";
      break;
  }
  closeCtx();
});

// --- live mode: poll for fresh data when served by ccstats-server ---
let liveSig = null;
async function pollLive() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) return;
    const fresh = await res.json();
    const sig = JSON.stringify(fresh.days);
    if (liveSig === null) { liveSig = JSON.stringify(DATA.days); }
    if (sig !== liveSig) {
      liveSig = sig;
      DATA.days = fresh.days;
      // the cached scalars are keyed by day and derived from DATA.days, which just changed
      for (const k of Object.keys(factorCache)) delete factorCache[k];
      // Project ids are ordinals assigned in first-seen order by whichever scan produced the
      // payload, so a fresh days map is only meaningful against the name map that came with it.
      // Carrying the old one over would silently relabel every bucket the moment a new project
      // appears; dropping it when the server is restarted without --projects is the same rule.
      if (fresh.projects) DATA.projects = fresh.projects;
      else delete DATA.projects;
      paintProjectBadge();
      dayKeys.length = 0;
      dayKeys.push(...Object.keys(DATA.days).sort());
      // first usage arriving while the empty-state shell is up: the dashboard markup is gone,
      // so rebuild it from scratch rather than rendering into elements that no longer exist
      if (noDataMode && dayKeys.length) return location.reload();
      render();
    }
  } catch {} // static file / no server — stay silent
}
setInterval(pollLive, 60000);

// --- first launch: a hello, and what to do with the thing ---
const helloEl = document.getElementById("hello");
// Split from showHello so switching language repaints the open dialog in place — setLang's
// render() rebuilds the panes, but this dialog lives outside .wrap and would otherwise keep
// the text of the language you just switched away from.
function paintHello() {
  document.getElementById("helloMark").innerHTML = icon("sparkles");
  document.getElementById("helloList").innerHTML = T("helloItems")
    .map(([ic, html]) => "<li>" + icon(ic) + "<span>" + html + "</span></li>").join("");
  document.getElementById("helloPrivacy").innerHTML = T("helloPrivacy");
  helloEl.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T(el.dataset.i18n); });
  paintLangPicks();
}
function showHello() {
  paintHello();
  helloEl.hidden = false;
  document.getElementById("helloGo").focus();
}
function dismissHello() {
  helloEl.hidden = true;
  // "1" suppresses it, "0" means show it again next launch. Ticked by default, so the standing
  // behaviour is unchanged — a dashboard you open daily should not greet you every time — but
  // unticking is now the way to keep it, rather than the dialog being silently one-shot.
  const again = document.getElementById("helloAgain");
  localStorage.setItem("ccstats-welcomed", !again || again.checked ? "1" : "0");
}
document.getElementById("helloGo").addEventListener("click", () => {
  const r = document.getElementById("helloGo").getBoundingClientRect();
  dismissHello();
  confetti(r.left + r.width / 2, r.top + r.height / 2, { n: 24 });
});
// click-outside and Esc both dismiss; the panel is informational, not a decision
helloEl.addEventListener("click", (e) => { if (e.target === helloEl) dismissHello(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !helloEl.hidden) dismissHello(); });

document.body.classList.toggle("redacted", redacted); // restore before first paint
applyStatic();
render();
// splash loader: hold ~1s, then fade and replay the entrance animations
const loader = document.getElementById("loader");
setTimeout(() => {
  loader.classList.add("done");
  render();
  setTimeout(() => loader.remove(), 500);
  // after the splash, not during it — two overlapping overlays on first run looks broken
  if (localStorage.getItem("ccstats-welcomed") !== "1") setTimeout(showHello, 260);
}, 1000);
</script>
</body>
